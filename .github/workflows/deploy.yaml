name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Read Cloudflare Pages project
        run: |
          PROJECT_NAME="$(awk -F'"' '/^name = / { print $2; exit }' wrangler.toml)"

          if [ -z "$PROJECT_NAME" ]; then
            echo "Could not read Pages project name from wrangler.toml." >&2
            exit 1
          fi

          echo "PROJECT_NAME=$PROJECT_NAME" >> "$GITHUB_ENV"

      - name: Validate Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing required secret: CLOUDFLARE_API_TOKEN." >&2
            exit 1
          fi

          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Missing required secret: CLOUDFLARE_ACCOUNT_ID." >&2
            exit 1
          fi

      - name: Ensure Cloudflare Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          response_file="$(mktemp)"
          status="$(
            curl -sS \
              -o "$response_file" \
              -w "%{http_code}" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT_NAME"
          )"

          case "$status" in
            200)
              echo "Cloudflare Pages project '$PROJECT_NAME' already exists."
              ;;
            404)
              echo "Creating Cloudflare Pages project '$PROJECT_NAME'."
              create_body="$(mktemp)"
              printf '{"name":"%s","production_branch":"main"}' "$PROJECT_NAME" > "$create_body"

              create_response_file="$(mktemp)"
              create_status="$(
                curl -sS \
                  -o "$create_response_file" \
                  -w "%{http_code}" \
                  -X POST \
                  -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                  -H "Content-Type: application/json" \
                  --data @"$create_body" \
                  "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
              )"

              if [ "$create_status" -lt 200 ] || [ "$create_status" -ge 300 ]; then
                echo "Cloudflare Pages project creation failed with HTTP $create_status." >&2
                cat "$create_response_file" >&2
                exit 1
              fi
              ;;
            *)
              echo "Cloudflare Pages project lookup failed with HTTP $status." >&2
              cat "$response_file" >&2
              exit 1
              ;;
          esac

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy --branch=main
